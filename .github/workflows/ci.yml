name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test CLI (drift fixture → exit 1)
        shell: bash
        run: |
          set +e
          node dist/cli.js test/fixtures/demo-app --json > /dev/null
          code=$?
          echo "exit=$code"
          test "$code" -eq 1

      - name: Smoke test CLI (clean fixture → exit 0)
        shell: bash
        run: |
          node dist/cli.js test/fixtures/clean-app --json > /dev/null
          code=$?
          echo "exit=$code"
          test "$code" -eq 0
