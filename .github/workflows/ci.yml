name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test CLI (drift fixture → exit 1)
        shell: bash
        run: |
          set +e
          node dist/cli.js test/fixtures/demo-app --json > /dev/null
          code=$?
          echo "exit=$code"
          test "$code" -eq 1

      - name: Smoke test CLI (clean fixture → exit 0)
        shell: bash
        run: |
          node dist/cli.js test/fixtures/clean-app --json > /dev/null
          code=$?
          echo "exit=$code"
          test "$code" -eq 0

      - name: Smoke test --fix dry-run (no mutation)
        shell: bash
        run: |
          before=$(md5sum test/fixtures/demo-app/.env.example | cut -d' ' -f1)
          node dist/cli.js test/fixtures/demo-app --fix --dry-run > /dev/null
          after=$(md5sum test/fixtures/demo-app/.env.example | cut -d' ' -f1)
          test "$before" = "$after" && echo "dry-run left file untouched"

      - name: Smoke test --fix --yes (cleans dead+leaks, restore after)
        shell: bash
        run: |
          cp test/fixtures/demo-app/.env.example /tmp/envex.bak
          # exit 1 after fix is CORRECT here: missing vars remain by design (never auto-filled)
          node dist/cli.js test/fixtures/demo-app --fix --yes > /dev/null || true
          # value lines must be gone (the tombstone comment mentions the name — that's by design)
          ! grep -q 'STRIPE_API_KEY=' test/fixtures/demo-app/.env.example
          ! grep -q 'postgres://user:pass' test/fixtures/demo-app/.env.example
          grep -q 'REMOVED_BY_ENVDRIFT' test/fixtures/demo-app/.env.example
          cp /tmp/envex.bak test/fixtures/demo-app/.env.example
          echo "fix applied and fixture restored"
